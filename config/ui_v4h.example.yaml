ui:
  title: Domain-RAG Agent Local Evidence Inspector

default_retrieval:
  mode: enhanced_sql_relation
  final_top_k: 8
  max_chunks_per_source: 2
  enable_calibration: true

retrieval_modes:
  - dense
  - enhanced
  - keyword
  - enhanced_keyword
  - sql_relation
  - enhanced_sql_relation

answer_eval_report_browser:
  enabled: true
  default_version: sample
  available_versions:
    - sample
  files:
    sample:
      eval_json: examples/eval/answer_eval_v4g.sample.json
      eval_jsonl: examples/eval/answer_eval_v4g.sample.jsonl
      results_csv: examples/eval/answer_eval_v4g.sample.csv
      compare_json: examples/eval/answer_eval_compare.sample.json
      compare_csv: examples/eval/answer_eval_compare.sample.csv
      report_md: examples/eval/answer_eval_v4g_report.sample.md
