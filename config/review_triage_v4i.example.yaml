inputs:
  default_version: sample
  eval_json:
    sample: examples/eval/answer_eval_v4g.sample.json
  eval_jsonl:
    sample: examples/eval/answer_eval_v4g.sample.jsonl

triage:
  include_versions:
    - sample
  include_failure_types:
    - llm_empty_answer
    - unsupported_claims_present
    - weak_claims_present
    - retrieval_insufficient
    - medium_or_lower_quality
  include_needs_human_review: true
  max_answer_preview_chars: 800
  max_prompt_preview_chars: 800
  max_raw_response_preview_chars: 800
  max_sources: 5

manual_fields:
  - manual_judgment
  - manual_citation_judgment
  - manual_should_refuse
  - manual_fix_suggestion
  - manual_notes

outputs:
  review_tasks_json: examples/eval/answer_eval_review_tasks_v4i.sample.json
  review_tasks_jsonl: examples/eval/answer_eval_review_tasks_v4i.sample.jsonl
  review_tasks_csv: examples/eval/answer_eval_review_tasks_v4i.sample.csv
  review_tasks_md: examples/eval/answer_eval_review_tasks_v4i.sample.md
  summary_json: examples/eval/answer_eval_review_triage_summary.sample.json
